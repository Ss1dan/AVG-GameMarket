<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVG-GameMarket - Регистрация</title>
    <link href="bootstrap/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="custom-container">
            <nav class="navbar navbar-expand-lg ">
                <div class="container-fluid">
                  <a class="navbar-brand" href="index.html">AVG-GameMarket</a>
                </div>
              </nav>
        </div>
    </header>
<section style="display: flex; padding-top: 100px;">
    <div class="container container-custom">
        <div class="row align-items-center">
            <!-- Левая часть - Бренд -->
            <div class="col-md-6 brand-side">
                <div class="logo-main display-4">AVG-GameMarket</div>
                <div class="subtitle-main">Ваш проводник в мир бесплатных компьютерных игр</div>
            </div>
            <!-- Правая часть - Форма -->
            <div class="col-md-6 form-side">
                <h2>Регистрация</h2>
                <form class="mt-4" action="addgame.html">
                    <div class="mb-3">
                        <input type="text" class="form-control" placeholder="Имя пользователя" required>
                    </div>
                    <div class="mb-3">
                        <input type="email" class="form-control" placeholder="Email" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" class="form-control" placeholder="Пароль" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" class="form-control" placeholder="Повторите пароль" required>
                    </div>
                        <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
                    <div class="text-center mt-3">
                        <a href="login.html" class="text-decoration-none">Уже есть аккаунт? Войти</a>
                    </div>
                </form>
            </div>
        </div>
    </div></section>    
    
</body>
</html>
