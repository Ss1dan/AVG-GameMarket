<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVG-GameMarket - Добавить игру</title>
    <link href="bootstrap/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
    </style>
</head>
<body>
    <!-- Шапка сайта -->
    <header>
        <div class="container mt-4">
            <nav class="navbar navbar-expand-lg ">
                <div class="container-fluid">
                  <a class="navbar-brand" href="index.html">AVG-GameMarket</a>
                  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                  </button>
                  <div class="collapse navbar-collapse" style="flex-direction: row-reverse;" id="navbarNav">
                    <ul class="navbar-nav">
                      <li class="nav-item">                        
                        <a class="nav-link" href="genre.html">Жанры</a>
                      </li>
                      <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="catalog.html">Каталог</a>
                      </li>
                      <li class="nav-item">
                        <a class="nav-link" href="vibor.html">Вход</a>
                      </li>
                    </ul>
                  </div>
                </div>
              </nav>
        </div>
    </header>

    <!-- Основной контент -->
    <div class="container mt-4">
        <!-- Форма добавления игры -->
        <div class="project-header bg-white rounded-3 p-4 shadow-sm mb-4">
            <h1 class="h2 mb-4">Добавить новую игру</h1>
            
            <div class="row">
                <!-- Левая колонка - основные поля -->
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="gameTitle" class="form-label">Название игры</label>
                        <input type="text" class="form-control" id="gameTitle" placeholder="Введите название игры">
                    </div>
                    
                    <div class="mb-3">
                        <label for="gameGenre" class="form-label">Жанры игры</label>
                        <input type="text" class="form-control" id="gameGenre" placeholder="Например: Экшн, RPG, Стратегия">
                    </div>
                    
                    <div class="mb-3">
                        <label for="gameFeatures" class="form-label">Особенности игры</label>
                        <textarea class="form-control" id="gameFeatures" rows="4" placeholder="Опишите ключевые особенности игры"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="mainImage" class="form-label">Файл для скачивания</label>
                        <input type="file" class="form-control" id="fileGame" file_extension>
                    </div>

                </div>
                
                <!-- Правая колонка - описание -->
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="gameDescription" class="form-label">Описание игры</label>
                        <textarea class="form-control" id="gameDescription" rows="8" placeholder="Подробно опишите вашу игру..."></textarea>
                    </div>
                </div>
            </div>
            
            <!-- Кнопки -->
            <div class="mt-4">
                <button type="submit" class="btn btn-primary me-2">Добавить игру</button>
                <button type="reset" class="btn btn-outline-secondary">Очистить форму</button>
            </div>
        </div>
         <!-- Галерея изображений -->
         <div class="gallery-container bg-white rounded-3 p-4 shadow-sm" style="margin-bottom: 50px;">
            <h2 class="h3 mb-4">Добавьте изображения игры</h2>
            
            <!-- Основное изображение -->
            <div class="mb-3">
                <label for="mainImage" class="form-label">Главное изображение</label>
                <input type="file" class="form-control" id="mainImage" accept="image/*">
            </div>
            
            <img src="#" alt="Предпросмотр" class="main-image w-100 rounded mb-3">
            
            <!-- Миниатюры -->
            <div class="mb-3">
                <label for="thumbnails" class="form-label">Дополнительные изображения</label>
                <input type="file" class="form-control" id="thumbnails" accept="image/*" multiple>
            </div>
            
            <div class="row g-2">
                <div class="col-6 col-md-4 col-lg-2">
                    <img src="#" alt="Миниатюра 1" class="thumbnail w-100 rounded">
                </div>
                <div class="col-6 col-md-4 col-lg-2">
                    <img src="#" alt="Миниатюра 2" class="thumbnail w-100 rounded">
                </div>
                <div class="col-6 col-md-4 col-lg-2">
                    <img src="#" alt="Миниатюра 3" class="thumbnail w-100 rounded">
                </div>
                <div class="col-6 col-md-4 col-lg-2">
                    <img src="#" alt="Миниатюра 4" class="thumbnail w-100 rounded">
                </div>
                <div class="col-6 col-md-4 col-lg-2">
                    <img src="#" alt="Миниатюра 5" class="thumbnail w-100 rounded">
                </div>
                <div class="col-6 col-md-4 col-lg-2">
                    <img src="#" alt="Миниатюра 6" class="thumbnail w-100 rounded">
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary me-2">Добавить фотографии</button>
                <button type="reset" class="btn btn-outline-secondary">Очистить фотографии</button>
            </div>
        </div>
    </div>
    </div>

    <!-- Подвал -->
    <footer class="bg-dark text-white pt-3 pb-5">
        <div class="container-xl custom-container d-flex justify-content-between align-items-center pb-3">
          <div>AVG-GameMarket</div>
          <div>
            <a href="genre.html" class="text-white me-4" style="text-decoration: none;">Жанры</a>
            <a href="catalog.html" class="text-white me-4" style="text-decoration: none;">Каталог</a>
            <a href="vibor.html" class="text-white me-4" style="text-decoration: none;">Вход</a>
          </div>
        </div>
        <div class="container-xl custom-container d-flex justify-content-between align-items-center pt-3 border-top">
          <p class="mb-0">Годовиков Александр Артёмович<br>Ирспк-223</p>
          <a href="#" class="btn btn-outline-light btn-sm">Вверх</a>
        </div>
      </footer>

    <script src="bootstrap/js/bootstrap.min.js"></script>
</body>
</html>
